[package]
name = "RustProject"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
lto = "thin"          # link-time opt without huge build time
codegen-units = 1     # better inlining across crates
panic = "abort"       # smaller + a hair faster (no unwinding)
strip = true
debug = false

[profile.dev]
opt-level = 1         # faster compiles for the edit/run loop

[dependencies]
glam = "0.30.5"
image = { version = "0.25.8", features = ["png", "gif"] }
libm = "0.2.15"
rand = "0.9.2"
rayon = "1.11.0"
tobj = "4.0.3"
typed-builder = "0.22.0"
